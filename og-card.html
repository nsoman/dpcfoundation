<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Castoro:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#002842;--blue-shade:#225372;--sky:#9bd7f9;--offwhite:#f1ebeb;}
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(155,215,249,.20), transparent 55%),
      radial-gradient(90% 90% at 0% 100%, rgba(34,83,114,.55), transparent 60%),
      linear-gradient(135deg,#002842,#013a5c);
    padding:74px 84px;display:flex;flex-direction:column;justify-content:space-between;
    font-family:'Montserrat',system-ui,Arial,sans-serif;
  }
  .top{display:flex;align-items:center;gap:20px}
  .top img{height:64px;width:auto;display:block}
  .badge{margin-left:auto;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--sky);font-weight:700;border:1.5px solid rgba(155,215,249,.5);
    padding:9px 16px;border-radius:999px}
  h1{font-family:'Castoro',Georgia,serif;font-style:italic;font-weight:400;color:#fff;
    font-size:82px;line-height:1.06;letter-spacing:-.01em;max-width:15ch}
  .accent{width:96px;height:5px;background:var(--sky);border-radius:3px;margin:6px 0 22px}
  p{color:var(--offwhite);font-size:26px;line-height:1.4;max-width:30ch;font-weight:400}
  .bottom{display:flex;align-items:center;justify-content:space-between}
  .url{color:var(--sky);font-size:24px;font-weight:600;letter-spacing:.02em}
  .tag{color:rgba(241,235,235,.7);font-size:18px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img src="images/logo-white.png" alt="Direct Primary Care Foundation" />
      <span class="badge">501(c)(3) Nonprofit</span>
    </div>
    <div>
      <h1>Direct Primary Care is the Future of Health</h1>
      <div class="accent"></div>
      <p>Supporting the growth and success of DPC for a healthier tomorrow.</p>
    </div>
    <div class="bottom">
      <span class="url">directprimarycare.com</span>
      <span class="tag">Research &middot; Education &middot; Direct Support</span>
    </div>
  </div>
</body>
</html>
