<!-- @dsCard group="Components" name="Buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Castoro:ital@1&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#002842;--sky:#9bd7f9;--offwhite:#f1ebeb;--black:#1e1e1e;--muted:#5b6b73;--fh:'Castoro',Georgia,serif;--fb:'Montserrat',system-ui,-apple-system,Arial,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--fb);color:var(--navy);background:#fff;padding:32px}
  h1{font-family:var(--fh);font-style:italic;font-weight:400;font-size:28px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:26px}
  .btn{display:inline-block;background:var(--sky);color:var(--black);font-family:var(--fb);font-weight:600;text-align:center;border-radius:.75rem;padding:.85rem 3.25rem;white-space:nowrap;font-size:.95rem;border:none;cursor:pointer}
  .btn.sm{padding:.6rem 1.4rem}
  .btn.hover{background:var(--offwhite);box-shadow:0 8px 18px -10px rgba(0,40,66,.5);transform:translateY(-2px)}
  .set{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-bottom:26px}
  .lbl{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8a979d;margin-bottom:2px}
</style>
</head>
<body>
  <h1>Buttons</h1>
  <div class="sub">Sky-blue fill, near-black label, 12px radius. Hover lightens to off-white and lifts 2px.</div>
  <div class="set"><span class="lbl">Default</span><a class="btn">Contact Us</a><a class="btn sm">Contact Us</a></div>
  <div class="set"><span class="lbl">Hover</span><a class="btn hover">Contact Us</a><a class="btn sm hover">Contact Us</a></div>
</body>
</html>
