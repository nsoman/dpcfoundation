<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Castoro:ital@1&family=Montserrat:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#002842;--blue-shade:#225372;--fh:'Castoro',Georgia,serif;--fb:'Montserrat',system-ui,-apple-system,Arial,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--fb);background:#fff;padding:32px;color:var(--navy)}
  h1.t{font-family:var(--fh);font-style:italic;font-weight:400;font-size:24px;margin:0 0 16px}
  .footer{border-top:1px solid #e6ebe8;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .copy{color:var(--blue-shade);font-size:15px}
  .menu{display:flex;gap:28px}
  .menu a{color:var(--navy);font-size:15px}
</style>
</head>
<body>
  <h1 class="t">Footer</h1>
  <div class="footer">
    <div class="copy">©2026 DirectPrimaryCare.com</div>
    <div class="menu"><a>LinkedIn</a><a>X</a><a>Facebook</a></div>
  </div>
</body>
</html>
